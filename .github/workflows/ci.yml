name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Gepinnt, gleiche Version wie in release.yml und release-candidate.yml.
  MCPB_VERSION: 2.1.2

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Swift 6 braucht Xcode >= 16: die neueste installierte Nicht-Beta-Version waehlen.
      - name: Select Xcode
        run: |
          set -euo pipefail
          # "|| true": ohne Treffer soll die Meldung unten erscheinen, nicht pipefail still abbrechen.
          XCODE="$(/bin/ls -d /Applications/Xcode_16*.app 2>/dev/null | /usr/bin/grep -vi beta | /usr/bin/sort -V | /usr/bin/tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode 16 found under /Applications (Swift 6 needs Xcode >= 16). Installed: $(/bin/ls -d /Applications/Xcode*.app 2>/dev/null | /usr/bin/tr '\n' ' ')"
            exit 1
          fi
          echo "Using $XCODE"
          /usr/bin/sudo /usr/bin/xcode-select -s "$XCODE"
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      - name: Swift tests
        run: npm run test:swift

      - name: Validate MCPB manifest
        run: npx -y "@anthropic-ai/mcpb@$MCPB_VERSION" validate manifest.json

      - name: TypeScript build
        run: npm run build

      # Ad hoc, ohne Secrets: prueft, dass das universelle Bundle entsteht.
      - name: Build helper
        run: npm run build:helper

      - name: Helper is universal
        run: |
          set -euo pipefail
          INFO="$(/usr/bin/lipo -info "bin/Mail MCP Helper (Ad hoc).app/Contents/MacOS/mail-helper")"
          echo "$INFO"
          echo "$INFO" | /usr/bin/grep -q x86_64
          echo "$INFO" | /usr/bin/grep -q arm64

      # Die Pruefungen des Release-Workflows muessen ein Ad-hoc-Bundle ablehnen; sonst pruefen sie nichts.
      - name: Release checks reject an ad-hoc bundle
        run: |
          set -uo pipefail
          if scripts/release/verify-bundle.sh "bin/Mail MCP Helper (Ad hoc).app" 2>verify.err; then
            echo "::error::verify-bundle.sh accepted an ad-hoc bundle"
            exit 1
          fi
          cat verify.err
          /usr/bin/grep -Eq 'verify-bundle: (Identifier|Authority) failed' verify.err
