name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Swift 6 braucht Xcode >= 16: die neueste installierte Nicht-Beta-Version waehlen.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(/bin/ls -d /Applications/Xcode_16*.app | /usr/bin/grep -vi beta | /usr/bin/sort -V | /usr/bin/tail -n 1)"
          echo "Using $XCODE"
          /usr/bin/sudo /usr/bin/xcode-select -s "$XCODE"
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      - name: Swift tests
        run: npm run test:swift

      - name: TypeScript build
        run: npm run build
