name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Gepinnt, gleiche Version wie in release.yml und release-candidate.yml.
  MCPB_VERSION: 2.1.2

jobs:
  build:
    # macos-14 wird am 2026-11-02 abgeschaltet. Das Deployment-Target 14.0 setzt swift/build.sh.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tests/plugin.test.ts liest manifest.json am Tag der Plugin-Version

      # Swift 6 braucht Xcode >= 16: die neueste installierte Nicht-Beta-Version waehlen.
      - name: Select Xcode
        run: |
          set -euo pipefail
          # "|| true": ohne Treffer soll die Meldung unten erscheinen, nicht pipefail still abbrechen.
          XCODE="$(/bin/ls -d /Applications/Xcode_16*.app 2>/dev/null | /usr/bin/grep -vi beta | /usr/bin/sort -V | /usr/bin/tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode 16 found under /Applications (Swift 6 needs Xcode >= 16). Installed: $(/bin/ls -d /Applications/Xcode*.app 2>/dev/null | /usr/bin/tr '\n' ' ')"
            exit 1
          fi
          echo "Using $XCODE"
          /usr/bin/sudo /usr/bin/xcode-select -s "$XCODE"
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      # Beide Swift-Pakete, siehe package.json.
      - name: Swift tests
        run: npm run test:swift

      - name: Validate MCPB manifest
        run: npx -y "@anthropic-ai/mcpb@$MCPB_VERSION" validate manifest.json

      - name: Validate actions MCPB manifest
        run: npx -y "@anthropic-ai/mcpb@$MCPB_VERSION" validate packages/actions/manifest.json

      - name: TypeScript build
        run: npm run build

      # Anders als release.yml immer, auch solange das Actions-Paket privat ist.
      - name: TypeScript build (actions)
        run: npm run build --workspace packages/actions

      # Ad hoc, ohne Secrets: prueft, dass das universelle Bundle entsteht.
      - name: Build helper
        run: npm run build:helper

      - name: Helper is universal
        run: |
          set -euo pipefail
          INFO="$(/usr/bin/lipo -info "bin/Mail MCP Helper (Ad hoc).app/Contents/MacOS/mail-helper")"
          echo "$INFO"
          echo "$INFO" | /usr/bin/grep -q x86_64
          echo "$INFO" | /usr/bin/grep -q arm64

      - name: Build actions bundle
        run: npm run build:helper --workspace packages/actions

      - name: Actions bundle is universal
        run: |
          set -euo pipefail
          INFO="$(/usr/bin/lipo -info "packages/actions/bin/Mail MCP Actions (Ad hoc).app/Contents/MacOS/mail-actions")"
          echo "$INFO"
          echo "$INFO" | /usr/bin/grep -q x86_64
          echo "$INFO" | /usr/bin/grep -q arm64

      # Die Pruefungen des Release-Workflows muessen ein Ad-hoc-Bundle ablehnen; sonst pruefen sie nichts.
      - name: Release checks reject an ad-hoc bundle
        run: |
          set -uo pipefail
          REQUIREMENT="$(node -p "require('./dist/signing.js').RELEASE_REQUIREMENT")"
          if scripts/release/verify-bundle.sh "bin/Mail MCP Helper (Ad hoc).app" "$REQUIREMENT" 2>verify.err; then
            echo "::error::verify-bundle.sh accepted an ad-hoc bundle"
            exit 1
          fi
          cat verify.err
          /usr/bin/grep -Eq 'verify-bundle: (Identifier|Authority) failed' verify.err

      - name: Release checks reject an ad-hoc actions bundle
        run: |
          set -uo pipefail
          REQUIREMENT="$(node -p "require('./packages/actions/dist/bundle.js').RELEASE_REQUIREMENT")"
          if scripts/release/verify-bundle.sh "packages/actions/bin/Mail MCP Actions (Ad hoc).app" "$REQUIREMENT" 2>verify.err; then
            echo "::error::verify-bundle.sh accepted an ad-hoc actions bundle"
            exit 1
          fi
          cat verify.err
          /usr/bin/grep -Eq 'verify-bundle: (Identifier|Authority) failed' verify.err
