name: Release

# Ein Tag v* baut, signiert, notarisiert und veroeffentlicht (Spec 16.2). Der Job laeuft in der
# Environment "release": erst Martins Freigabe dort gibt die Signing-Secrets frei (D4).
# Die Schritte rufen scripts/release/*.sh, dieselben wie release-candidate.yml.
on:
  push:
    tags: ['v*']

# Zwei Tags kurz hintereinander duerfen sich nicht beim Veroeffentlichen ueberholen.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # GitHub-Release
  id-token: write # npm-Provenance, Attestation, MCP-Registry-Anmeldung
  attestations: write

env:
  APPLE_TEAM_ID: 4KTGF63CD2
  CODESIGN_IDENTITY: 'Developer ID Application: Martin Alker (4KTGF63CD2)'
  # Gepinnt, gleiche Version wie in ci.yml und release-candidate.yml.
  MCPB_VERSION: 2.1.2

jobs:
  release:
    # macos-14 wird am 2026-11-02 abgeschaltet. Das Deployment-Target 14.0 setzt swift/build.sh.
    runs-on: macos-15
    environment: release
    # Grosszuegig ueber Build, Tests und Notarisierung (--timeout 30m); begrenzt, wie lange der Job laeuft.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check-tag.sh braucht origin/main
          # Kein Schreib-Token in .git/config fuer die spaeteren Schritte; gh bekommt GH_TOKEN gezielt.
          persist-credentials: false

      # Wie in ci.yml: neueste Nicht-Beta-Version von Xcode 16.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(/bin/ls -d /Applications/Xcode_16*.app 2>/dev/null | /usr/bin/grep -vi beta | /usr/bin/sort -V | /usr/bin/tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode 16 found under /Applications."
            exit 1
          fi
          /usr/bin/sudo /usr/bin/xcode-select -s "$XCODE"
          swift --version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check tag
        run: scripts/release/check-tag.sh "$GITHUB_REF_NAME"

      # Das Actions-Paket geht erst mit, wenn der Maintainer "private" aus seinem package.json entfernt.
      # Bis dahin ueberspringt jeder Schritt mit diesem Gate; ein Lauf veroeffentlicht nur das Lesepaket.
      - name: Is the actions package enabled?
        id: actions
        run: |
          set -euo pipefail
          ENABLED="$(scripts/release/actions-enabled.sh)"
          echo "enabled=$ENABLED" >>"$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TZ: Europe/Berlin

      - name: Swift tests
        run: npm run test:swift

      - name: TypeScript build
        run: npm run build

      - name: TypeScript build (actions)
        if: steps.actions.outputs.enabled == 'true'
        run: npm run build --workspace packages/actions

      # Vor Build und Notarisierung, damit ein fehlendes Secret nicht erst nach Minuten auffaellt.
      - name: Check secrets
        run: scripts/release/require-env.sh APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Import signing certificate
        run: scripts/release/import-signing.sh
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build helper (Developer ID)
        run: npm run build:helper
        env:
          CI: 'true'

      # Vor dem Entfernen des Schluesselbunds: Es braucht dieselbe Developer-ID-Identitaet.
      - name: Build actions bundle (Developer ID)
        if: steps.actions.outputs.enabled == 'true'
        run: npm run build:helper --workspace packages/actions
        env:
          CI: 'true'

      # Gleich nach dem Signieren: danach laeuft Fremdcode (mcpb per npx, Attestation, npm,
      # mcp-publisher), der die Developer-ID-Identitaet nicht mehr erreichen soll. Notarisieren und
      # Stapeln brauchen den Schluesselbund nicht.
      - name: Remove keychain after signing
        run: scripts/release/cleanup-keychain.sh

      - name: Notarize and staple
        run: scripts/release/notarize.sh "bin/Mail MCP Helper.app" "$RUNNER_TEMP/mail-helper.zip"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Notarize and staple the actions bundle
        if: steps.actions.outputs.enabled == 'true'
        run: scripts/release/notarize.sh "packages/actions/bin/Mail MCP Actions.app" "$RUNNER_TEMP/mail-actions.zip"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Verify bundle
        id: bundle
        run: |
          set -euo pipefail
          REQUIREMENT="$(node -p "require('./dist/signing.js').RELEASE_REQUIREMENT")"
          CDHASH="$(scripts/release/verify-bundle.sh "bin/Mail MCP Helper.app" "$REQUIREMENT")"
          echo "cdhash=$CDHASH" >>"$GITHUB_OUTPUT"

      - name: Verify actions bundle
        id: actions_bundle
        if: steps.actions.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          REQUIREMENT="$(node -p "require('./packages/actions/dist/bundle.js').RELEASE_REQUIREMENT")"
          CDHASH="$(scripts/release/verify-bundle.sh "packages/actions/bin/Mail MCP Actions.app" "$REQUIREMENT")"
          echo "cdhash=$CDHASH" >>"$GITHUB_OUTPUT"

      - name: Verify npm package
        id: npm
        run: |
          set -euo pipefail
          TARBALL="$(scripts/release/verify-npm-pack.sh "${{ steps.bundle.outputs.cdhash }}")"
          echo "tarball=$TARBALL" >>"$GITHUB_OUTPUT"

      - name: Verify actions npm package
        id: actions_npm
        if: steps.actions.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TARBALL="$(scripts/release/verify-npm-pack.sh "${{ steps.actions_bundle.outputs.cdhash }}" packages/actions)"
          echo "tarball=$TARBALL" >>"$GITHUB_OUTPUT"

      - name: Build and verify MCPB
        id: mcpb
        run: |
          set -euo pipefail
          MCPB="$(scripts/release/build-mcpb.sh . "${{ steps.bundle.outputs.cdhash }}")"
          echo "path=$MCPB" >>"$GITHUB_OUTPUT"

      - name: Build and verify actions MCPB
        id: actions_mcpb
        if: steps.actions.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          MCPB="$(scripts/release/build-mcpb.sh packages/actions "${{ steps.actions_bundle.outputs.cdhash }}" "${{ steps.bundle.outputs.cdhash }}")"
          echo "path=$MCPB" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/mail-helper.zip
            ${{ steps.mcpb.outputs.path }}

      - uses: actions/attest-build-provenance@v4
        if: steps.actions.outputs.enabled == 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/mail-actions.zip
            ${{ steps.actions_mcpb.outputs.path }}

      - name: Publish to npm and GitHub
        run: scripts/release/publish.sh "${{ steps.npm.outputs.tarball }}" "${{ steps.mcpb.outputs.path }}" "$RUNNER_TEMP/mail-helper.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          # Kein NODE_AUTH_TOKEN: seit 0.1.1 Trusted Publishing ueber OIDC (id-token: write). Der erste
          # Publish (AMM-9) lief mit NPM_TOKEN, das Secret ist geloescht.

      # Nach dem Lesepaket. Scheitert das hier, endet der Lauf rot, das Lesepaket ist draussen und die
      # Registry-Schritte unten laufen nicht; wie es weitergeht, steht in docs/releasing.md. Kein
      # automatischer zweiter Versuch: publish.sh ueberspringt beim Re-Run, was schon draussen ist.
      - name: Publish actions package to npm and GitHub
        if: steps.actions.outputs.enabled == 'true'
        run: scripts/release/publish.sh --actions "${{ steps.actions_npm.outputs.tarball }}" "${{ steps.actions_mcpb.outputs.path }}" "$RUNNER_TEMP/mail-actions.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      # Zuletzt: scheitert die Registry, sind npm und Release trotzdem draussen; registry.yml holt nach.
      # Ohne Pfad: Die Pruefsumme kommt vom veroeffentlichten Asset. Ein Re-Run baut das .mcpb neu, und
      # dessen Bytes unterscheiden sich von dem, das im Release liegt.
      - name: Publish to the MCP Registry
        run: scripts/publish-registry.sh --package read
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish actions package to the MCP Registry
        if: steps.actions.outputs.enabled == 'true'
        run: scripts/publish-registry.sh --package actions
        env:
          GH_TOKEN: ${{ github.token }}

      # Rueckfall, falls ein Schritt davor gescheitert ist.
      - name: Remove keychain
        if: always()
        run: scripts/release/cleanup-keychain.sh
